name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, pcntl, posix
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: composer audit

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: gramphp
          MARIADB_DATABASE: gramphp
          MARIADB_USER: gramphp
          MARIADB_PASSWORD: gramphp
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s --health-timeout=5s --health-retries=30
    env:
      GRAMPHP_TEST_MARIADB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=gramphp;charset=utf8mb4"
      GRAMPHP_TEST_MARIADB_USER: gramphp
      GRAMPHP_TEST_MARIADB_PASSWORD: gramphp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pcntl, posix
          coverage: none
      - run: sudo apt-get install -y --no-install-recommends graphviz
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
